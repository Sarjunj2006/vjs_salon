<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bookings — VJ Signature Salon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  /* all classes start with bk- so nothing clashes with the main site */
  .bk-page { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; --bk-line: rgba(0,0,0,0.1); --bk-soft: var(--text-soft, #6b6b6b); }
  .bk-page [hidden] { display: none !important; }
  .bk-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .bk-head h1 { margin: 0; font-size: 1.7rem; }
  .bk-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .bk-tab { padding: 8px 14px; border: 1px solid var(--bk-line); border-radius: 999px; background: transparent; cursor: pointer; font: inherit; font-size: 0.9rem; color: inherit; }
  .bk-tab.bk-on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .bk-count { font-size: 0.8rem; opacity: 0.7; margin-left: 4px; }
  .bk-day { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--bk-soft); margin: 20px 0 8px; font-weight: 600; }
  .bk-card { background: #fff; border: 1px solid var(--bk-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
  .bk-card.bk-done { opacity: 0.6; }
  .bk-time { font-weight: 600; font-size: 1.05rem; min-width: 64px; font-variant-numeric: tabular-nums; }
  .bk-body { flex: 1; min-width: 0; }
  .bk-name { font-weight: 600; }
  .bk-meta { font-size: 0.88rem; color: var(--bk-soft); margin-top: 2px; }
  .bk-meta a { color: inherit; }
  .bk-badges { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .bk-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,0.06); text-transform: uppercase; letter-spacing: 0.03em; }
  .bk-badge.bk-paid { background: #e3f4e8; color: #1e6b37; }
  .bk-badge.bk-completed { background: #1a1a1a; color: #fff; }
  .bk-action { white-space: nowrap; }
  .bk-empty { text-align: center; color: var(--bk-soft); padding: 40px 0; }
  .bk-updated { font-size: 0.8rem; color: var(--bk-soft); text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="bk-page">

  <!-- LOGIN -->
  <div id="bkLogin" hidden>
    <div class="login-box">
      <h1>Bookings</h1>
      <p>Log in with the bookings password.</p>
      <form id="bkLoginForm">
        <div class="field">
          <label for="bkPw">Password</label>
          <input type="password" id="bkPw" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
        <div class="error-msg" id="bkLoginError"></div>
      </form>
    </div>
  </div>

  <!-- BOOKINGS -->
  <div id="bkApp" hidden>
    <div class="bk-head">
      <h1>Bookings</h1>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-ghost btn-small" id="bkRefresh">Refresh</button>
        <button type="button" class="btn btn-ghost btn-small" id="bkLogout">Log out</button>
      </div>
    </div>
    <div class="bk-tabs" id="bkTabs">
      <button type="button" class="bk-tab bk-on" data-filter="today">Today<span class="bk-count" data-count="today"></span></button>
      <button type="button" class="bk-tab" data-filter="upcoming">Upcoming<span class="bk-count" data-count="upcoming"></span></button>
      <button type="button" class="bk-tab" data-filter="completed">Completed<span class="bk-count" data-count="completed"></span></button>
      <button type="button" class="bk-tab" data-filter="all">All<span class="bk-count" data-count="all"></span></button>
    </div>
    <div id="bkList"></div>
    <div class="bk-updated" id="bkUpdated"></div>
  </div>
</div>

<script>
(function () {
  const API = '/api/bookings-view';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const todayIST = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
  let bookings = [];
  let filter = 'today';
  let timer = null;

  async function api(method, path, body) {
    const res = await fetch(API + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/login') { showLogin(); throw new Error('Please log in again.'); }
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  function showLogin() {
    clearInterval(timer);
    $('bkApp').hidden = true;
    $('bkLogin').hidden = false;
  }

  async function showApp() {
    $('bkLogin').hidden = true;
    $('bkApp').hidden = false;
    await load();
    clearInterval(timer);
    timer = setInterval(() => load().catch(() => {}), 60 * 1000); // auto-refresh every minute
  }

  async function load() {
    bookings = await api('GET', '/list');
    render();
    $('bkUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }

  function matches(b, f) {
    const today = todayIST();
    if (f === 'today') return b.date === today;
    if (f === 'upcoming') return b.status !== 'completed' && b.date >= today;
    if (f === 'completed') return b.status === 'completed';
    return true;
  }

  function dayLabel(date) {
    const today = todayIST();
    const d = new Date(date + 'T00:00:00+05:30');
    const tomorrow = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date(Date.now() + 86400000));
    const pretty = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
    if (date === today) return 'Today · ' + pretty;
    if (date === tomorrow) return 'Tomorrow · ' + pretty;
    return pretty;
  }

  function render() {
    for (const f of ['today', 'upcoming', 'completed', 'all']) {
      const n = bookings.filter((b) => matches(b, f)).length;
      document.querySelector(`[data-count="${f}"]`).textContent = n ? `(${n})` : '';
    }
    let list = bookings.filter((b) => matches(b, filter));
    if (filter === 'completed' || filter === 'all') list = list.slice().reverse(); // newest first
    if (!list.length) {
      $('bkList').innerHTML = '<div class="bk-empty">No bookings here.</div>';
      return;
    }
    let html = '';
    let lastDate = null;
    for (const b of list) {
      if (b.date !== lastDate) { html += `<div class="bk-day">${esc(dayLabel(b.date))}</div>`; lastDate = b.date; }
      const done = b.status === 'completed';
      const phone = b.mobile ? `<a href="tel:${esc(b.mobile)}">${esc(b.mobile)}</a>` : '';
      html += `
        <div class="bk-card ${done ? 'bk-done' : ''}">
          <div class="bk-time">${esc(b.time)}</div>
          <div class="bk-body">
            <div class="bk-name">${esc(b.customer) || 'Customer'}</div>
            <div class="bk-meta">${[esc(b.service), b.stylist ? 'with ' + esc(b.stylist) : '', phone].filter(Boolean).join(' · ')}</div>
            ${b.notes ? `<div class="bk-meta" style="font-style:italic;">“${esc(b.notes)}”</div>` : ''}
            <div class="bk-badges">
              ${done ? '<span class="bk-badge bk-completed">Completed</span>' : ''}
              ${b.paymentStatus === 'paid' ? '<span class="bk-badge bk-paid">Deposit paid</span>' : ''}
              ${b.source ? `<span class="bk-badge">${esc(b.source)}</span>` : ''}
              ${b.orderId ? `<span class="bk-badge">${esc(b.orderId)}</span>` : ''}
            </div>
          </div>
          <div class="bk-action">
            ${done
              ? `<button type="button" class="btn btn-ghost btn-small" data-status="upcoming" data-id="${esc(b.id)}">Undo</button>`
              : `<button type="button" class="btn btn-primary btn-small" data-status="completed" data-id="${esc(b.id)}">Mark completed</button>`}
          </div>
        </div>`;
    }
    $('bkList').innerHTML = html;
  }

  $('bkList').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-status]');
    if (!btn) return;
    btn.disabled = true;
    try {
      const updated = await api('PUT', '/' + encodeURIComponent(btn.dataset.id) + '/status', { status: btn.dataset.status });
      const i = bookings.findIndex((b) => b.id === updated.id);
      if (i !== -1) bookings[i] = updated;
      render();
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
    }
  });

  $('bkTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('[data-filter]');
    if (!tab) return;
    filter = tab.dataset.filter;
    document.querySelectorAll('.bk-tab').forEach((t) => t.classList.toggle('bk-on', t === tab));
    render();
  });

  $('bkRefresh').addEventListener('click', () => load().catch((err) => alert(err.message)));

  $('bkLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('bkLoginError').textContent = '';
    try {
      await api('POST', '/login', { password: $('bkPw').value });
      $('bkPw').value = '';
      await showApp();
    } catch (err) { $('bkLoginError').textContent = err.message; }
  });

  $('bkLogout').addEventListener('click', async () => {
    await api('POST', '/logout').catch(() => {});
    showLogin();
  });

  fetch(API + '/me').then((r) => r.json()).then((me) => {
    if (me.viewer || me.admin) showApp().catch(showLogin); else showLogin();
  }).catch(showLogin);
})();
</script>
</body>
</html>
